name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build/test jobs require Xcode 26 (Swift tools 6.2) and the macOS 26 SDK,
# which are not yet available on GitHub-hosted runners. They will be added
# back once Apple's macos-26 image ships. Until then we run lint only —
# enough to catch obvious style regressions on PRs without flagging green
# on builds that aren't actually verified.
jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict Tokemon/ TokemonTests/ TokemonUITests/
